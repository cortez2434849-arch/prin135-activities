<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
</head>
<body>

  <h1>Checkout</h1>

  <section>
    <h2>Your Cart</h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Grey abstract cube item">
    <p>Mystery Cube - Qty: 1 - $24.99</p>
  </section>

  <section>
    <h2>Payment Information</h2>
    <form>
      <label for="card-name">
        Name on Card
        <span aria-hidden="true">*</span>
      </label>
      <input type="text" id="card-name" name="card-name" required>
<br>
      <label for="card-number">
        Card Number
        <span aria-hidden="true">*</span>
      </label>
      <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
      <p id="card-number-help">Enter the 16-digit number with no spaces or dashes.</p>

      <button type="submit">Complete Purchase</button>
    </form>
  </section>

</body>
</html>
